name: awaitly-validation

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_awaitly
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_awaitly"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Separate from a developer's MongoDB on 27019: recovery tests interrupt this
  # instance. No external databases or application containers are restarted.
  mongo-recovery:
    image: mongo:7
    ports:
      - "127.0.0.1:57017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 30
