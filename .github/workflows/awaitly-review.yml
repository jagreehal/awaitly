name: awaitly review

# Runs ./action.yml on this repo's own pull requests, with the CLI built
# from the branch under review rather than the published package.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: awaitly-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@10.28.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter "awaitly-analyze..." build

      - uses: ./
        with:
          path: apps packages/awaitly-analyze/src/__fixtures__
          cli: node packages/awaitly-analyze/dist/cli.js
